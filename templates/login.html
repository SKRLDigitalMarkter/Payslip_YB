{% extends "base.html" %}

{% block title %}HR Login — YAYATH BUILDTECH Payroll Portal{% endblock %}

{% block content %}
<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
  <div class="glass-card" style="width: 100%; max-width: 440px; padding: 2.5rem 2rem; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15); border-radius: var(--radius-lg);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: rgba(30, 58, 138, 0.08); margin-bottom: 1rem;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: #0F172A; margin-bottom: 0.35rem;">HR Portal Login</h2>
      <p style="font-size: 0.85rem; color: #64748B;">Enter your credentials to access the Payroll System</p>
    </div>

    {% if error %}
    <div style="background: #FEE2E2; border: 1px solid #F87171; color: #991B1B; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.6rem;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="user_id" class="form-label" style="font-weight: 600; color: #1E293B;">User ID</label>
        <div style="position: relative;">
          <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94A3B8;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </span>
          <input type="text" id="user_id" name="user_id" class="form-control" placeholder="Enter User ID (e.g. HR123)" style="padding-left: 2.5rem;" required autofocus>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1.75rem;">
        <label for="password" class="form-label" style="font-weight: 600; color: #1E293B;">Password</label>
        <div style="position: relative;">
          <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94A3B8;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter Password" style="padding-left: 2.5rem;" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 0.95rem; font-weight: 700;">
        Sign In to Payroll Portal
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </form>

    <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle); font-size: 0.75rem; color: #94A3B8;">
      <span>🔒 Authorized Personnel Only &bull; Secured Session</span>
    </div>
  </div>
</div>
{% endblock %}
